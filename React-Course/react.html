<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        button {
            background-color: green;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 15px;
        }

        .chat-input {
            padding: 12px 20px;
            border: 2px solid #C4C4C4;
            border-radius: 10px;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>


    <script type="text/babel">
        function ChatInput({chatMessages, setChatMessages}) {
              const[inputText, setInputText]=  React.useState('');

            function saveInputText(event){
                setInputText(event.target.value);
            }

            function sendMessage(){
                const newChatMessages = [
                        ...chatMessages,
                        {
                            message: inputText,
                            sender: 'user',
                            id: crypto.randomUUID()
                        }

                    ]

                    setChatMessages(newChatMessages);

               const response = Chatbot.getResponse(inputText);
                             setChatMessages([
                        ...newChatMessages,
                        {
                            message: response,
                            sender: 'robot',
                            id: crypto.randomUUID()
                        }

                    ]);
                setInputText('');
            }
            return (
                <>
                    <input
                        placeholder="Send your message to ChatBot..."
                        size="30"
                        onChange={saveInputText}
                        value = {inputText}
                        className="chat-input"
                    />
                    <button
                    onClick={sendMessage}
                    
                    >Send</button>
                </>
            );
        }
        function ChatMessage(props) {
            const message = props.message;
            const sender = props.sender;
            /*
            if(sender === 'robot'){
                return(
                  <div>
                     <img src="images-course/robot.png" width="50" alt="" />
                    {message}

                    </div>  
                );
            }
                */
            return (
                <div>
                    {sender === 'robot' && (
                        <img src="images-course/robot.png" width="50" alt="" />
                    )}

                    {message}

                    {sender === 'user' && (
                        <img src="images-course/user.png" width="50" alt="" />
                    )}

                </div>
            );
        }

        function ChatMessages({chatMessages}) {

            return (
                <>
                    {chatMessages.map((chat) => {
                        return (
                            <ChatMessage
                                message={chat.message}
                                sender={chat.sender}
                                key={chat.id}
                            />
                        );
                    })};
                </>
            );
        }



        function App() {

              const [chatMessages, setChatMessages] = React.useState([{
                message: 'hello ChatBot',
                sender: 'user',
                id: 'id1'
            }, {

                message: 'How can I assist you today?',
                sender: 'robot',
                id: 'id2'
            }, {
                message: 'What is the weather like today?',
                sender: 'user',
                id: 'id3'
            }, {
                message: 'The weather is sunny with a high of 25 degrees.',
                sender: 'robot',
                id: 'id4'
            }
            ]);
            //const[chatMessages, setChatMessages]=array

            //const chatMessages = array[0];

            //const setChatMessages = array[1];

            return (
                <>
                    <ChatInput 
                    chatMessages={chatMessages}
                    setChatMessages={setChatMessages}
                    />
                    <ChatMessages 
                    chatMessages={chatMessages}
                    />
                </>
            );
        }



        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>


</body>

</html>
